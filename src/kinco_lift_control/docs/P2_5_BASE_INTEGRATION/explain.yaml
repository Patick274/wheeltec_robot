# ============================================================
# P2-5 真实底盘与升降联调说明
# ============================================================
# 阅读任务单,不是rosparam配置;不要加载此文件启动运动.
# 与其它功能包explain.yaml一致,按目的、文件、命令、步骤和排障组织.
# 本轮只准备与修复本地代码;以下现场动作未执行.

任务:
  名称: "P2-5真实/odom与100rpm双向许可联调"
  日期: "2026-11-04"
  工作包: "kinco_lift_control + turn_on_wheeltec_robot"
  前置进度: "daily_11_04追记已报告上端释放、保持和SIGKILL滑行实测通过"
  本轮修复: "保持速度正负对称去抖;重复暂停/中立不重置保持监测"
  目标: "真实底盘准备/正在运动时升降不超过100rpm,失去许可时底盘持续发送零速"
  验收边界: "本任务先在低位完成联锁;高位行车稳定性另作机械验收"

相关文件:
  升降入口: "../../scripts/lift_node.py"
  决策层: "../../src/kinco_lift/controller.py"
  静止检查: "../../src/kinco_lift/interlock.py"
  实物参数: "../../config/lift.yaml"
  底盘策略: "../../../turn_on_wheeltec_robot/include/lift_motion_gate.h"
  底盘串口入口: "../../../turn_on_wheeltec_robot/src/wheeltec_robot.cpp"
  底盘启动: "../../../turn_on_wheeltec_robot/launch/include/base_serial.launch"
  连续记录器: "../../scripts/status_logger.py"
  兼容释放入口: "../../scripts/limit_escape.py(ROS客户端,不能再按旧方式停lift后直接跑)"
  流程图: "../CONTROL_LOGIC.mmd"
  控制逻辑PPT: "../升降控制逻辑流程图_20261104.pptx"
  禁止误用: "nudge_up/estop_direct属于独立CAN现场工具,不作为本任务的日常控制入口"

环境准备:
  同步: "先保存Jetson自己的差异,同步两个控制包;确认rospack find定位的是本次源码"
  编译: "在实际catkin工作区执行catkin_make,随后source devel/setup.bash"
  离线测试: "python3 -B -m unittest discover -s $(rospack find kinco_lift_control)/tests"
  master:
    原则: "升降和底盘必须在同一个测试master上;独立roscore进程避免required节点退出带走自动master"
    单Jetson终端示例: |
      export ROS_MASTER_URI=http://127.0.0.1:11321
      export ROS_HOSTNAME=127.0.0.1
    主进程示例: "roscore -p 11321"
    其它主机: "跨机时使用真实可达地址,不能照抄127.0.0.1;每个终端检查echo $ROS_MASTER_URI"
    生产master: "若现场改用11311,所有参与节点统一切换,不要同时保留另一套真实底盘实例"
  当前默认: "实物四项门禁false,初始高度2.05m,110s预算/300s冷却"
  机械状态: "从低位和现场已确认的保持/急停条件开始;不直接安排高位行车"
  传输: "先确认唯一正式CAN主站;只读probe必须退出后再启动lift"

# ---------- 建立真实反馈 ----------
阶段一_只读与反馈来源:
  操作:
    - "定位并停止fake_odom发布器,不要仅修改订阅话题后留下同名假消息"
    - "启动真实底盘节点,此时无lift许可应保持最终串口零速"
    - "启动lift实物节点,门禁先保持false"
    - "核对/odom唯一发布源、消息频率、速度单位、frame_id与对应底盘"
  只读命令: |
    rostopic info /odom
    rostopic hz /odom
    rostopic echo -n 1 /odom
    rostopic info /cmd_vel
    rostopic echo -n 1 /lift/status
    rosparam get /lift
  通过:
    - "真实里程计持续更新,无真假双发布"
    - "simulate=false,底盘反馈健康,未知/故障没有被伪造为0"
    - "无运动许可时底盘最终输出仍为零"
  失败处理: "查话题发布源、master、串口和节点路径;不关闭require_base_feedback来绕过"

阶段二_静止噪声:
  采集: "底盘物理静止时采集不少于30s的vx/vy/wz,同时记录电机和载荷状态"
  核对参数:
    指令死区: "线0.001m/s,角0.002rad/s"
    测量噪声地板: "线0.005m/s,角0.01rad/s"
    motion阈值: "0.02m/s与0.05rad/s,当前仅校验阈值顺序"
    静止持续: "1s,反馈0.5s内持续新鲜"
  判定: "按实测分布解释静止确认,不要为通过测试直接放大阈值"
  两层区别: "Python允许噪声地板内静止候选;C++请求释放目前用串口反馈精确零,小残差可能只导致保留100rpm限制"
  记录: "保存分位数/最大值、阈值、发布频率和是否存在长期小残差"

# ---------- 双向许可 ----------
阶段三_底盘零速时握手:
  现场许可: "前两阶段通过后,按现场流程显式开放所需实物门禁,不修改默认提交值"
  顺序:
    - "确认低位参考和当前模式,先保持升降不动"
    - "从已有手柄/导航输入链路发有限时低速命令,不要绕过最终串口门控"
    - "观察非零request序号、升降base_speed_limit_rpm<=100、同序号permit"
    - "确认只有许可与指令/反馈都新鲜时底盘实际运动"
    - "松手/停命令后确认底盘停稳,请求归零再释放自动低速保持"
  观察命令: |
    rostopic echo /lift/base_motion_request
    rostopic echo /lift/base_motion_permit
    rostopic echo /lift/status
  必须记录: "请求号、许可号、实际底盘速度、最终串口输出或其现场采样证据"
  注意: "/cmd_vel是运动意图,不是最终串口输出,不能仅看话题非零就认定底盘已运动"

阶段四_升降减速与底盘起步:
  顺序:
    - "先验证升降<=100rpm时低位小范围联动"
    - "前项通过后,在可用中段启动单个受限升降任务"
    - "底盘申请运动,确认升降请求降速,实际转速<=100rpm前底盘保持零速"
    - "实际和目标转速均<=100rpm后才发匹配许可,底盘才起步"
    - "底盘停稳后本次升降任务不应突然恢复高速"
  通过: "实际转速限制成立且双向时序正确,没有靠事后报警才停车"
  取证: "rosbag/CSV采用同一时间基准,覆盖cmd、odom、request、permit和lift/status"
  转速公式: "rpm=velocity_raw*1875/(512*65536);日志raw不能直接当rpm"

# ---------- 失效与收尾 ----------
阶段五_断更和拒绝:
  分级:
    - "先用离线测试验证NaN/inf、错误序号和旧许可"
    - "低位现场验证许可发布停止/指令停止发布后底盘归零"
    - "再验证真实/odom停止更新时升降请求停机、许可撤销"
  时间参数: "许可/命令约0.3s,底盘反馈0.5s,还应记录线程调度与下位机真实停车时间"
  恢复: "反馈恢复后先确认停稳与原因,不自动复位故障或续跑旧升降目标"
  通过: "失效后最终输出为零,旧序号和旧目标不能自动恢复运动"
  边界: "若CAN/ROS完全断链,软件回执不能证明物理停车,保留独立保持和急停条件"

阶段六_收尾:
  操作:
    - "按现场流程回低位并确认真实下限位"
    - "确认实际停稳后执行显式撤使能/正常节点关闭"
    - "关闭临时运动门禁,恢复110s预算/300s冷却,再次只读启动检查配置"
    - "保存版本、参数快照、发布源信息、数据记录和通过/失败项"
  不自动执行: "本文件只做任务交接,没有在Windows或Jetson运行这些动作"

# ---------- 记录与验收 ----------
记录模板:
  版本与环境: "commit、工作区路径、ROS_MASTER_URI、simulate、编译/测试结果"
  发布源: "/odom实际发布节点和频率,/cmd_vel发布节点,是否停止假发布器"
  基础信息: "高度/载荷、限位、有效模式、门禁和工作制参数"
  试验行: "编号、开始时间、输入、预期、观察值、最大rpm、最终输出、结论、记录路径"
  通过清单: "真实反馈、噪声、同号许可、先减速后起步、停稳释放、断更归零"
  后续单列: "高位行车稳定性,不要因本任务软件联锁通过就标记机械稳定性通过"

常见问题:
  底盘不走: "先查同号许可和freshness、真实串口反馈、lift是否健康,不要跳过门控"
  永远100rpm: "检查base_auto_hold、请求是否归零、/cmd_vel残留和C++精确零反馈"
  odom_stale: "先查真实发布源和master,不要启动假odom给真实运动续许可"
  holding误报: "本轮已修正正负对称去抖;若真实位置漂移仍立即停止,不直接放大位置容差"
  上端受困: "正式escape服务已经现场验收,无需在P2-5重复送到机械开关做前置"
  停止距离: "日志20.5mm为一次约1015rpm下行SIGKILL插值结果,不能当全工况保证值"
