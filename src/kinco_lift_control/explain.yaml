# ---------- 文件与调用关系 ----------
核心文件:
  "scripts/lift_node.py": "ROS入口,服务/话题接线,底盘反馈,周期轮询及退出"
  "src/kinco_lift/controller.py": "运动决策、参考、模式切换、限位、故障和上端释放状态"
  "src/kinco_lift/canopen.py": "SocketCAN/SDO,回执与对象检查,EMCY/boot/节点保护"
  "src/kinco_lift/interlock.py": "底盘反馈健康、指令死区、静止噪声和限速判定"
  "src/kinco_lift/teleop.py": "方向键解析、方向相关速度区、累计运动预算"
  "src/kinco_lift/simulator.py": "内存CAN驱动器,无真实加减速/弹簧/负载动力学"
  "scripts/lift_keyboard.py": "方向键终端;显式确认与使能,心跳超时或松键停车"
  "scripts/probe_drive.py": "独立只读诊断;不要与正式节点同时独占同一驱动器SDO"
  "scripts/field_p2.py": "现场服务客户端,status/watch/recover/move/halt/stop/disable/escape_upper"
  "scripts/limit_escape.py": "兼容入口,调用正式escape服务;需要lift节点运行"
  "scripts/status_logger.py": "连续记录带时间戳状态CSV"
  "scripts/nudge_up.py": "历史上限位试验前置工具,直接CAN,不属于正式恢复/底盘联调入口"
  "scripts/estop_direct.py": "直接CAN诊断工具,不能代替物理急停或正式通信监督"
  "config/lift.yaml": "真实参数,四项门禁默认false,工作制110s预算/300s冷却"
  "launch/lift.launch": "默认simulate=false,加载参数并启动/lift,不自动重连"
  "srv/": "MoveLift/JogLift/MoveTopHeight;其它恢复服务使用std_srvs/Trigger"
  "CMakeLists.txt": "生成服务、安装正式节点/配置/文档;修改后在Jetson重新catkin_make"
  "tests/": "内存CAN、ROS桩、真实子进程与原生C++联锁测试"

# ---------- 控制流程 ----------
控制流程:
  启动:
    - "加载参数,选择SocketCAN或明确的SimulatedCan"
    - "读取6041/6063/606C/60FD/2601/2602,订阅/odom和/cmd_vel"
    - "保持未使能;不自动寻零、清故障或恢复上次运动"
  建参考:
    下限位: "reference_here或confirm_keyboard_coordinates;静止且帧/精度匹配"
    高位帧完好: "显式reference_from_frame,两限位都未触发且静止;到家后重新物理对零"
    原始计数: "不清编码器;会话参考与驱动器绝对计数分开"
  显式使能:
    - "检查门禁、底盘健康、工作制和会话条件"
    - "清旧速度,写所选6060模式,配置停止策略/6083/6084/6085并回读"
    - "6007先关闭处理,配置200ms乘3监督,建立节点保护流后再武装6007"
    - "执行6040的6/7/F握手,核对6061有效模式"
  键盘速度模式:
    模式: "6060=3;↑上升,↓下降;默认先发中立,再接受方向"
    配速: "中段1000rpm;到运动方向的端部低速区100rpm"
    停车: "松键/超时写60FF=0并保留使能;方向限位和内缩端点阻止继续靠近"
    安全速度: "还需与底盘100rpm上限、当前任务已降速值取更低值"
  位置模式:
    模式: "6060=1;绝对升长mm/有限点动/顶端总高度m"
    转换: "高度转607A计数,6081速度在线只降不升"
    到位: "6041 bit10、位置误差和实际低速同时成立"
    暂停: "bit8暂停并撤目标,保留使能;不自动续跑"
  统一监督:
    - "驱动器错误、EMCY、重启、SDO超时/错误回应"
    - "底盘反馈缺失/非法、有效模式、精度/帧跳变、限位、工作制和超时"
    - "正常参数拒绝只回绝;真实异常撤任务、撤参考并请求快停锁存"

# ---------- 恢复与保持 ----------
恢复流程:
  回下限位: "recover_to_lower_limit,默认50rpm/10s分段,由poll监督,完成停稳撤使能"
  上限位受困:
    入口: "/lift/escape_upper_limit"
    条件: "显式请求,门禁许可,未使能/空闲/无锁存,只有上限位有效,底盘静止且帧可信"
    限制: "默认50rpm向下,最多10s或20mm;不扩大正常行程"
    状态: "starting -> descending -> halting -> holding"
    完成: "开关释放且进入正常边界,实际停稳后upper_escape_complete=true"
    保持: "保留使能和guard;速度抖动正负对称去抖0.5s,位置漂移超过0.2mm立即拒绝"
    中断: "暂停/中立取消下降;全局stop可锁存;重复暂停不重置保持锚点或去抖时钟"
    后续: "现场确认后显式disable,重新确认参考,再选择位置模式;不自动回家"
  退出: "finally/rospy清理和atexit兜底;SIGKILL无Python清理,依靠驱动器监督及机械保持"

# ---------- 底盘双向许可 ----------
底盘联锁:
  底盘实现: "../turn_on_wheeltec_robot/include/lift_motion_gate.h及src/wheeltec_robot.cpp"
  输入链路: "手柄/导航 -> twist_mux -> /cmd_vel -> C++最终串口门控"
  请求: "底盘20Hz发布/lift/base_motion_request(UInt64序号)"
  升降处理: "收到请求保留100rpm上限,实际与命令转速都不超过100rpm才返回同序号许可"
  许可: "/lift/base_motion_permit(UInt64),底盘校验序号和新鲜度"
  零速条件: "无匹配许可、许可/指令过期或底盘串口反馈过期时,最终串口速度为0"
  时效: "请求/许可/底盘命令约0.3s,底盘反馈0.5s;底盘停稳持续1s才释放请求"
  断链: "请求丢失撤许可,升降仍保留低速限制;不会立即恢复1000rpm"
  发布频率: "lift状态默认10Hz,底盘门控20Hz;使用单调墙钟"
  注意: "必须同步编译升降与底盘两个包;假odom不能证明真实底盘联锁"
  平滑器: "当前默认smoother=false;改变话题重映射后必须核对lift实际观察的指令源"

# ---------- 接口速查 ----------
接口:
  状态: "/lift/status(JSON),/lift/busy,/lift/position_mm,/lift/top_height_m"
  位置使能: "/lift/enable(std_srvs/SetBool)"
  键盘确认: "/lift/confirm_keyboard_coordinates(std_srvs/Trigger)"
  键盘使能: "/lift/enable_keyboard(std_srvs/SetBool)"
  键盘命令: "/lift/keyboard_command(std_msgs/Int8,-1/0/+1)"
  位置目标: "/lift/move(MoveLift,height_mm,speed_mm_s)"
  有限点动: "/lift/jog(JogLift,distance_mm,speed_mm_s)"
  总高度: "/lift/move_top_height(MoveTopHeight,target_height_m)"
  普通暂停: "/lift/keyboard_stop(std_srvs/Trigger),位置模式也可用"
  故障停机: "/lift/stop(std_srvs/Trigger),回执不等于实际停稳"
  复位: "/lift/reset_fault(std_srvs/Trigger),人工检查后显式调用"
  参考: "/lift/reference_here或/lift/reference_from_frame"
  底端恢复: "/lift/recover_to_lower_limit"
  上端释放: "/lift/escape_upper_limit"
  人工底盘请求: "/lift/request_base_motion(std_srvs/SetBool);不能替代底盘最终许可门控"

# ---------- 常用命令 ----------
命令:
  前提: "在Jetson对应终端source ROS和实际catkin工作区devel/setup.bash;不要在Windows执行"
  单机测试master: |
    export ROS_MASTER_URI=http://127.0.0.1:11321
    export ROS_HOSTNAME=127.0.0.1
    roscore -p 11321
  实物只读启动: "roslaunch kinco_lift_control lift.launch"
  离线模拟启动: "roslaunch kinco_lift_control lift.launch simulate:=true"
  健康检查: "rostopic echo -n 1 /lift/status"
  全部单测: "python3 -B -m unittest discover -s $(rospack find kinco_lift_control)/tests"
  下一阶段: "按docs/P2_5_BASE_INTEGRATION/explain.yaml逐项记录,不同时启动真假/odom"

