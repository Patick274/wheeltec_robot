# ============================================================
# turn_on_wheeltec_robot 功能包 - 逐文件说明 (new.yaml)
# ============================================================
# 本文件是本包所有文件的作用说明,以当前实际代码为准(车型已切换为 senior_wheeltec).
# 旧版说明见 explain.yaml(部分内容已过时:其中车型仍写 mini_diff,实际已改为 senior_wheeltec).

包概览:
  名称: turn_on_wheeltec_robot
  定位: Wheeltec 整机主控包(私有闭源)
  职责:
    - 串口驱动底盘: 下发速度指令,读取里程计/IMU/电池电压 (wheeltec_robot_node)
    - 发布 TF 树与 URDF 模型 (robot_model_visualization.launch)
    - 一键启动建图 / 导航 / 自主探索
    - 保存建好的地图
  当前硬件: senior_wheeltec 底盘(差速 2 驱动轮)+ 双 M10 雷达(lsm10_v2 合并为单路 /scan)+ 无摄像头
  当前导航栈: teb 局部规划器(默认)/ dwa(备选),全局规划 global_planner,定位 amcl

# ============================================================
# 顶层文件
# ============================================================
顶层:
  CMakeLists.txt:
    作用: 编译配置
    内容: 编译可执行文件 wheeltec_robot_node(源文件 src/wheeltec_robot.cpp + src/Quaternion_Solution.cpp),
          链接 catkin 库,依赖 serial/roscpp/sensor_msgs/tf 等;C++11 编译
  package.xml:
    作用: ROS 包清单(包名/依赖声明)
    内容: 包名 turn_on_wheeltec_robot,依赖 roscpp serial sensor_msgs nav_msgs tf actionlib 等
  explain.yaml:
    作用: 旧版功能包说明文档(2026-08-27)
    备注: 内容较全(含 twist_mux 仲裁,串口排查),但车型仍写 mini_diff,已过时;以本 new.yaml 为准

# ============================================================
# configuration_files/
# ============================================================
configuration_files:
  wheeltec_2d.lua:
    作用: cartographer 2D 建图配置,由 launch/include/algorithm_cartographer.launch 加载
    内容: map_frame=map,tracking_frame=base_footprint,odom_frame=odom_combined;
          双 M10 已合并为单路 /scan(num_laser_scans=1);M10 量程 0.25~12m;
          ARM 平台减负(降采样运动滤波,降低闭环频率)

# ============================================================
# costmap_common_params/  (按车型分目录,由 car_mode 参数选择加载)
#   三个车型目录,每个目录 3 个文件:
#     costmap_common_params.yaml        - 代价地图通用参数(被 teb/dwa launch 加载)
#     teb_local_planner_params.yaml     - teb 局部规划器参数
#     costmap_common_params_pure3d.yaml - 纯 3D 导航版参数(孤儿,无任何 launch 引用)
# ============================================================
costmap_common_params:
  param_senior_wheeltec:   # ★ 本车(senior_wheeltec),footprint 0.724×0.559m 实测
    costmap_common_params.yaml:
      作用: 代价地图静态层/障碍层/膨胀层参数
      要点: footprint [[-0.37,-0.29],[-0.37,0.29],[0.37,0.29],[0.37,-0.29]],inflation_radius 0.4,
            障碍层观测源 scan(sensor_frame laser)
    teb_local_planner_params.yaml:
      作用: teb 局部规划器参数(速度限制,footprint_model polygon,轨迹优化权重)
      要点: max_vel_x 0.5,acc_lim_theta 0.3,footprint_model.vertices 同 footprint
    costmap_common_params_pure3d.yaml:
      作用: 纯 3D 导航代价地图参数(3D 导航已删除,本文件无引用)
  param_senior_diff:       # senior_diff 车型(保留车型)
    costmap_common_params.yaml: 同 senior_wheeltec,但 footprint/inflation 按 senior_diff 尺寸
    teb_local_planner_params.yaml: 同 senior_wheeltec,footprint_model.vertices 为 senior_diff 尺寸
    costmap_common_params_pure3d.yaml: 纯 3D 版(孤儿)
  param_six_wheel_with_lebai:  # 六轮 + lebai 机械臂车型(保留车型)
    costmap_common_params.yaml: 同上三件套(six_wheel 尺寸)
    teb_local_planner_params.yaml: 同上(six_wheel 尺寸,权重略有差异)
    costmap_common_params_pure3d.yaml: 纯 3D 版(孤儿)

# ============================================================
# include/   (头文件)
# ============================================================
include:
  wheeltec_robot.h:
    作用: 底盘节点类 turn_on_robot 声明
    内容: 串口协议宏(帧头 0x7B/帧尾 0x7D),收发数据结构体,IMU/里程计协方差矩阵,
          IMU 量程换算系数(GYROSCOPE_RATIO/ACCEl_RATIO),类成员与成员函数声明
  Quaternion_Solution.h:
    作用: 四元数姿态解算函数声明(InvSqrt,Quaternion_Solution)

# ============================================================
# src/   (源码)
# ============================================================
src:
  wheeltec_robot.cpp:
    作用: ★ 底盘串口通信节点主实现
    功能: 订阅 cmd_vel → 打包成串口协议帧(速度放大 1000 倍)发给下位机 STM32;
          读串口逐帧校验(BCC)→ 解析速度/IMU/电压 → 发布 odom,imu,PowerVoltage 话题,
          并对速度积分得里程计位姿
  Quaternion_Solution.cpp:
    作用: IMU 姿态解算(Mahony 互补滤波: 角速度积分 + 加速度计重力修正)
    输出: 四元数写入全局 Mpu6050.orientation

# ============================================================
# launch/   (顶层启动文件)
# ============================================================
launch:
  turn_on_wheeltec_robot.launch:
    作用: ★ 底层总启动(最常用)
    组成: base_serial.launch(底盘+twist_mux) + robot_model_visualization.launch(模型+TF)
          + robot_pose_ekf.launch(EKF 定位) + teb/dwa(navigation:=true 时)
    参数:
      car_mode: 车型,默认 senior_wheeltec,可选 senior_diff / six_wheel_with_lebai
      navigation: 是否同时开导航(默认 false)
      repeat: 是否重复开底层(语音自主建图用,默认 false)
      is_cartographer: 是否用 cartographer 建图(默认 false)
      odom_frame_id: 里程计 frame(默认 odom_combined)
      local_planner: 局部规划器 teb(默认)/ dwa
  wheeltec_lidar.launch:
    作用: 雷达启动
    参数: rplidar_mode 默认 ls_M10_double(双 M10),可选思岚 A1/A2/A3/S1,镭神 M10 单/双,C16,ls_multi
  mapping.launch:
    作用: 建图总入口(开雷达 + 建图算法 + 底层节点)
    参数: mapping_mode 默认 gmapping,可选 hector/karto/cartographer
  navigation.launch:
    作用: 导航总入口(底层 navigation:=true + 雷达 + map_server + amcl + send_mark)
    参数: map_file 默认 map/third.yaml;local_planner 透传
  rrt_slam.launch:
    作用: rrt 自主探索建图(include simple.launch + mapping.launch navigation:=true)
  simple.launch:
    作用: rrt_exploration 包的自主探索节点(global/local_rrt_detector + filter.py + assigner.py + wait_for_fin)
  robot_model_visualization.launch:
    作用: 只发布 URDF 模型与车型 TF(RViz 看车用)
    内容: 三种车型各自的 static TF(laser/camera/gyro),robot_description 加载,
          joint_state_publisher + robot_state_publisher
  rviz_nav_console.launch:
    作用: RViz 多点导航控制台(启动 rviz_nav_console.py)
  image/turn_on_wheeltec_robot.launch.png:
    作用: 文档配图(启动文件说明截图)

# ============================================================
# launch/include/   (被顶层 launch include 的子模块)
# ============================================================
launch_include:
  base_serial.launch:
    作用: 底盘节点 + twist_mux 速度仲裁
    内容: twist_mux 节点(手柄 cmd_vel_teleop 高优先级,导航 cmd_vel_nav 低优先级→cmd_vel)
          + wheeltec_robot_node(串口 /dev/wheeltec_controller,115200)
  teb_local_planner.launch:
    作用: move_base + teb 局部规划器(默认方案)
    内容: 加载 param_common 4 个文件 + param_$(car_mode)/teb + costmap;
          remap cmd_vel → cmd_vel_nav(交 twist_mux 仲裁)
  dwa_local_planner.launch:
    作用: move_base + dwa 局部规划器(Jetson 负载高时的轻量备选)
  robot_pose_ekf.launch:
    作用: EKF 融合轮式里程计 + IMU,发布 odom_combined 定位
    备注: is_cartographer:=true 时不启动(cartographer 自己发 map→odom_combined)
  velocity_smoother.launch:
    作用: yocs_velocity_smoother 速度平滑(默认不开,由 base_serial.launch 的 smoother 参数控制)
  amcl.launch:
    作用: AMCL 自适应蒙特卡洛定位(导航用)
  algorithm_gmapping.launch:
    作用: gmapping 建图算法
  algorithm_hector.launch:
    作用: hector 建图算法(纯激光,无需里程计,含 trajectory_server + geotiff 保存)
  algorithm_karto.launch:
    作用: karto(SLAM)建图算法
  algorithm_cartographer.launch:
    作用: cartographer 建图算法(cartographer_node + occupancy_grid_node)

# ============================================================
# map/   (地图文件)
# ============================================================
map:
  third.yaml + third.pgm:
    作用: ★ 当前默认导航地图(navigation.launch 的 map_file 默认值)
  map_saver.launch:
    作用: 保存地图(map_saver 节点,输出到 map/WHEELTEC.pgm/yaml)
  历史地图(11 / 20220427 / 20220527 / 2107 / first / second 的 .pgm+.yaml):
    作用: 历年建图产物,当前无 launch 引用(仅 third 被使用),可归档删除

# ============================================================
# param_common/   (所有车型共用参数)
# ============================================================
param_common:
  move_base_params.yaml:
    作用: move_base 全局/局部规划器选型,控制/规划频率,恢复行为配置
  global_costmap_params.yaml:
    作用: 全局代价地图(frame=map,三层插件 static/obstacle/inflation)
  local_costmap_params.yaml:
    作用: 局部代价地图(rolling_window,两层插件 obstacle/inflation)
  base_global_planner_param.yaml:
    作用: global_planner(Dijkstra/A*)参数
  dwa_local_planner_params.yaml:
    作用: DWA 规划器速度/采样/评分参数(切 dwa 时加载)
  wheeltec_smoother.yaml:
    作用: yocs_velocity_smoother 速度平滑参数(默认不用)
  rviz_nav_points_example.yaml:
    作用: 多点导航航点示例(供 rviz_nav_console.py 参考)
    备注: rviz_nav_console.launch 实际引用的是 discrete_nav_points.yaml(不存在),属遗留笔误

# ============================================================
# scripts/   (脚本)
# ============================================================
scripts:
  wheeltec_udev.sh:
    作用: ★ 串口设备 udev 绑定脚本(需 sudo 运行一次)
    内容: 按厂商 ID/序列号把 ttyUSB* 绑成固定名 /dev/wheeltec_controller,/dev/wheeltec_lidar1,/dev/wheeltec_lidar2
  send_mark.py:
    作用: RViz 多点导航标记节点(订阅 /clicked_point 与 /send_mark_goal,发布 MarkerArray 与目标点,支持巡航,'c' 清空)
  rviz_nav_console.py:
    作用: Qt 版 RViz 导航控制台(2D Pose Estimate / 2D Nav Goal 工具,航点保存/加载到 YAML)
  run_square.py:
    作用: 测试脚本,让车走正方形(actionlib 调 move_base)
  save_cartographer_map.sh:
    作用: cartographer 建图保存脚本(结束轨迹 → 写 pbstream → 转 pgm/yaml)

# ============================================================
# urdf/   (机器人模型)
# ============================================================
urdf:
  senior_diff_robot.urdf:
    作用: senior_diff 车型模型(保留车型,robot_model_visualization.launch 加载)
  lebai_lm3.gv / lebai_lm3.pdf:
    作用: lebai 机械臂参考文档(Graphviz 图 + PDF),机械臂已删除,无引用
  six_only/:
    six_only.xacro + six_only.svg:
      作用: 六轮底盘模型(无机械臂),无任何 launch 引用(孤儿)
  six_wheel_with_lebai/:
    six_wheel_with_lebai.xacro:
      作用: 六轮 + lebai 机械臂车型主模型(include lm3_macro + gripper_macro,底盘内联)
    lm3_macro.xacro:
      作用: lebai LM3 机械臂宏(mesh 引用 lebai_lm3_support 包)
    gripper_macro.xacro:
      作用: 夹爪宏(mesh 引用 lebai_lm3_support 包)
    gripper.xacro:
      作用: 独立夹爪模型(引用 lebai_lm3_support 的 gripper_macro,未被 six_wheel_with_lebai.xacro include)
    six_only.xacro:
      作用: 六轮底盘变体(无机械臂,未被 include,孤儿)

# ============================================================
# 常用命令
# ============================================================
常用命令:
  只开底盘: roslaunch turn_on_wheeltec_robot turn_on_wheeltec_robot.launch
  建图:     roslaunch turn_on_wheeltec_robot mapping.launch
  导航:     roslaunch turn_on_wheeltec_robot navigation.launch
  自主探索: roslaunch turn_on_wheeltec_robot rrt_slam.launch
  绑定串口: sudo bash scripts/wheeltec_udev.sh(新电脑只需一次)
