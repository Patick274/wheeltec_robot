文档信息:
  项目名: "wheeltec-hx"
  定位: "轮式升降机器人(机型 wheeltec_03)的上位机客户端,CLI 形态"
  仿制对象: "jdyw-hx(Desktop/项目/jdyw-hx)的机型包架构;范围收敛,差异见 docs/architecture.md"
  机器人: "wheeltec 差速底盘 + kinco FD125 升降柱 + lslidar 雷达 + usb_cam 相机,ROS1 Noetic(Jetson)"
  上位机环境: "Windows/Linux 均可;Python>=3.9;唯一运行时依赖 roslibpy;不需要装 ROS"
  连接方式: "仅 roslibpy 腿(rosbridge WebSocket);rclpy 是 ROS2/DDS,连 ROS1 机器人物理上不通"
  当前阶段: "离线搭建完成,19 项测试全绿;话题表来自机器人侧源码离线阅读,待真机自省核实"
  注意: "本目录在 catkin 工作空间 src 下但不是 ROS 包;CATKIN_IGNORE 已置,不参与 catkin_make"

# ---------- 这个软件是干什么的 ----------
作用:
  一句话: "在没有 ROS 环境的电脑上,经 rosbridge 连接机器人,看数据、发指令"
  下行(订阅):
    - "机器人模型描述 /robot_description(URDF 全文)"
    - "坐标系变换 /tf(动态)+ /tf_static(静态,latch)"
    - "电池电压 /PowerVoltage(兼作在线心跳,6s 无帧判离线)"
    - "里程计 /odom(只取 twist 线/角速度;位姿权威是 TF,不走第二条路)"
    - "IMU /imu、轮关节 /joint_states、相机 /image_raw/compressed"
    - "升降柱 /lift/status(latch JSON)+ /lift/position_mm + /lift/top_height_m"
  上行(指令):
    - "底盘速度 /cmd_vel(geometry_msgs/Twist,带 ttl 看门狗超时回零)"
    - "升降柱服务 /lift/jog、/lift/move、/lift/move_top_height、/lift/enable、/lift/stop、/lift/escape_upper_limit"
  白名单纪律: "未在机型表声明的能力词/指令一律拒绝,不猜(仿 jdyw-hx 安全闸)"

