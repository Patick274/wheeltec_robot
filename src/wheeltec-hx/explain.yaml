# ---------- 数据链路形状 ----------
数据链路:
  订阅链: "rosbridge → RobotLink(族 _worker) → 机型 parser → (meta, raw) → 机型 decode → 帧对象 → 帧回调(CLI 打印)"
  两段式契约: "parser 与 decode 分侧同住本机型包;jdyw-hx 中间隔 IPC 子进程,本软件单进程——契约一字不变,将来搬回多进程只加 IPC 不改解析"
  start_after 闸门: "tf/tf_static 声明 start_after=robot_description——URDF 首帧到达前挂起(jdyw-hx 2026-10-10 口径:URDF 必须先装配完)"
  latch 补订: "qos=transient_local 的话题 1.5s 一轮先退后订,连续 rearm_dry_limit 轮无新载荷指纹收手(ROS2 rosbridge 回放随机子集的教训,ROS1 latch 一次全量但补订无害)"
  心跳: "/PowerVoltage 是唯一在线心跳源;6s 无帧判离线;该话题绝不节流(节流丢帧=假离线)"
  死手: "velocity 指令带 ttl_ms,看门狗超时自动发 zero——防客户端卡住机器人继续跑"
  上行链: "CLI cmd/vel → RobotLink.send_command → 按 COMMANDS 的 kind 分派:topic→publish / service→call;action 未实现(本机型 ROS1 无 action 服务端在案,真机发现再补)"

