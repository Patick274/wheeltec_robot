# ---------- 真机注意事项(离线阅读已观察到) ----------
注意事项:
  升降底盘联锁: "底盘节点在升降未给 /lift/base_motion_permit 时强制零速(发速度≠底盘会动;动不了先查 /lift/status——安全特性不是故障)"
  twist_mux 仲裁: "/cmd_vel 前串了 twist_mux,手柄 cmd_vel_teleop 优先级最高——摇杆在用时上位机速度指令被压制"
  启动默认只读: "升降柱必须先 /lift/enable 才能动(机器人侧安全设计)"
  lift_status 形态: "std_msgs/String 承载 latch JSON;字段集以 lift_node.py 的 publish() 为准,本侧 dict 透传不逐字段建模(机器人加字段自动可见)"
  rosbridge uint8: "uint8[] 经 rosbridge 编成 base64,parser 必须还原(as_bytes)"
  rosbridge 部署: "机器人侧需 roslaunch rosbridge_server rosbridge_websocket.launch(默认 9090);这是上机前置条件"

