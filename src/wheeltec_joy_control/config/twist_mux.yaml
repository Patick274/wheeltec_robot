# ============================================================
# twist_mux 多路速度仲裁配置
# 作用: 多个节点同时发布速度指令时, 按优先级选择一路转发给底盘
#
# 数据流向:
#   手柄 joycontrol  --> cmd_vel_teleop --┐
#                                          ├--> twist_mux --> cmd_vel --> 底盘
#   move_base(teb)   --> cmd_vel_nav   ---┘
#
# 参数说明:
#   name:     输入源名称(随意取, 仅用于日志显示)
#   topic:    订阅的速度话题
#   timeout:  该来源超过多少秒没有新消息, 就视为"失效",
#             仲裁器自动切换到低优先级的有效来源
#   priority: 优先级, 0~255, 数字越大优先级越高,
#             高优先级来源一旦有效就会抢占输出
# ============================================================

topics:
  # ---- 手柄遥控: 最高优先级 ----
  # 推动摇杆时立即接管机器人; 松手后 joycontrol 停止发布,
  # 超过 timeout(0.5s) 后自动让位给导航
  - name    : teleop
    topic   : cmd_vel_teleop
    timeout : 0.5
    priority: 100

  # ---- 自主导航(teb/dwa): 低优先级, 保底通道 ----
  # move_base 输出。只要手柄没在动, 导航指令就会被转发给底盘
  - name    : navigation
    topic   : cmd_vel_nav
    timeout : 0.2
    priority: 10

# locks 段可用于"急停锁定"等场景(订阅 std_msgs/Bool, 收到 true 即锁死输出)
# 目前未用到, 留空
locks: []
