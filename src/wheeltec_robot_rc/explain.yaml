# turtlebot_joy.cpp 这个文件是手柄控制的cpp文件

# turtlebot_teleop_key.py 这个是键盘控制的py文件
# ##控制速度比例
# 按键	(k_speed, k_turn)	效果
# q	(1.1, 1.1)	线速度,角速度同时 ×1.1,整体加速
# z	(0.9, 0.9)	线速度,角速度同时 ×0.9,整体减速
# w	(1.1, 1)	只加大线速度,旋转速度不变
# x	(0.9, 1)	只减小线速度,旋转速度不变
# e	(1, 1.1)	只加大旋转角速度,线速度不变
# c	(1, 0.9)	只减小旋转角速度,线速度不变
# ##运动控制
# 按键	(x, th)	运动效果
# i	(1, 0)	纯前进,不转向
# ,	(-1, 0)	纯后退,不转向
# j	(0, 1)	原地左转,不前后走
# l	(0, -1)	原地右转,不前后走
# u	(1, 1)	前进 + 左转
# o	(1, -1)	前进 + 右转
# .	(-1, 1)	后退 + 左转
# m	(-1, -1)	后退 + 右转

# mux.yaml
# 文件用途:**多 cmd_vel 源优先级管理配置**.
# 小车会收到多个地方发来的速度指令(遥控手柄,安全避障控制器,导航 MoveBase),不能直接混在一起,这个 yaml 用来配置**多个速度订阅源:超时时间,优先级,话题名**.

# mux 只会选择**一个生效源**输出,不会把两个速度叠加.

# 行为规则:
# 1. 如果**两个源同时有效(都在 timeout 时间内收到消息)**:优先采用优先级更高的`Safe reactive controller`的速度指令.
# > 
# > 场景:你键盘遥控让小车往前走,但是安全检测到障碍物,安全控制器输出减速 / 停止,会覆盖键盘指令,实现安全保护.
# 2. 如果高优先级源超时失效(超过 0.2s 没消息),系统才会使用低优先级的遥控指令.
# 3. 如果遥控 1 秒没有新按键消息,遥控源失效.