# ---------- 坐标系转换说明 (map → odom → base) ----------
坐标系转换:
  完整链条:
    map -> odom_combined -> base_footprint -> base_link -> 传感器
  各段含义与发布者:
    base_footprint -> base_link:
      发布: URDF 的 base_footprint_joint (robot_state_publisher)
      含义: 固定车体高度 0.169m,静态不变
    base_link -> laser/gyro_link/laser1/laser2:
      发布: URDF 各 joint + base_to_laser 静态发布
      含义: 传感器在车上的安装位置,静态不变
    odom_combined -> base_footprint:
      发布: robot_pose_ekf (轮子里程计 + IMU 融合, output_frame=odom_combined)
      含义: 机器人相对上电起点的位姿,会漂移,~30Hz 连续平滑
    map -> odom_combined:
      发布: gmapping(建图时) / amcl(导航时), odom_frame 都配成 odom_combined
      含义: 把漂移的里程计纠正到固定地图,更新慢且有跳变
  为什么拆成 odom 和 map 两段:
    - odom->base 保持局部平滑无跳变(运动控制/避障需要)
    - 激光匹配定位的阶跃跳变全部塞进 map->odom 这一小段,不破坏 odom->base 的平滑轨迹
  位姿合成 (TF 自动连乘):
    Pose_in_map = (map->odom_combined) · (odom_combined->base_footprint) · (base_footprint->base_link)
  注意:
    - 里程计 frame 名是 odom_combined(robot_pose_ekf 输出),不是默认的 odom
    - gmapping/amcl 的 odom_frame 都配置为 odom_combined,链条才接得上
    - cartographer 建图时 is_cartographer:=true 关掉 ekf,cartographer 直接发 map->odom_combined

