# ---------- 关键技术结论 (lsm10 双雷达融合) ----------
双雷达融合结论:
  融合节点: lsm10_v2/src/lsm10_double.cpp (project() 函数)
  补偿方式: 对每帧每个点做 旋转(rotate) + 平移(xoffset/yoffset),即
            px = x*cos(rotate) - y*sin(rotate) + xoff
            py = x*sin(rotate) + y*cos(rotate) + yoff
  参数 (lsm10_v2.launch):
    laser1(前,物理+0.3): rotate=180, xoffset=+0.3
    laser2(后,物理-0.3): rotate=0,   xoffset=-0.3
  结论:
    - 前雷达是 180° 反转的,后雷达不转 (rotate 作用在数据上,非 TF 帧)
    - x/y 位置已在融合内部补偿到车体中心(0,0);TF 不能再加 x/y 偏移
    - 旋转也已在融合内部补偿;TF 不能再加 yaw
    - z(高度) 融合内部不补偿(单线 2D),必须靠 TF 的 laser 帧 z 给出
    - laser / laser1 / laser2 高度一致,均为 0.204
      = 0.169(base_footprint->base_link) + 0.035(base_link->lidar)

# ---------- 最终 TF 树 ----------
tf树:
  map -> odom_combined -> base_footprint -> base_link
  base_footprint --(URDF base_footprint_joint, z=0.169)--> base_link
  base_link --(gyro_joint)--> gyro_link (IMU)
  base_link --(laser1_joint, x=+0.3, z=0.035)--> laser1 (前雷达原始帧)
  base_link --(laser2_joint, x=-0.3, z=0.035)--> laser2 (后雷达原始帧)
  base_link --(left/right_wheel_joint)--> left/right_wheel_link
  base_link --(arm_joint)--> arm_link (升降杆)
  base_footprint --(static 0 0 0.204 0 0 0)--> laser (融合 /scan 帧)

