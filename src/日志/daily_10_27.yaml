# ---------- R1/R2/R3 修复内容 ----------
修复:
  R1_底端内缩死结:
    问题: 正常停车在 lower+5mm 内缩, 重启后 reference_here 要求真实下限位, jog 又被 inset 拦截, 死结
    修复: controller.py 新增 recover_to_lower_limit(rpm=50, timeout_s=10)
          未使能/无故障/位置高于参考时下, 速度模式慢速下行至 60FD bit0 触发
          lift_node.py 新增服务 /lift/recover_to_lower_limit (Trigger)
    实机验证: 从 1891943 经历 4 次调用回到 150017, 下限位触发
  R2_静止判定阈值:
    问题: 旧 ParkingInterlock 用 0.01/0.02 单一阈值, 把微速与噪声混为一谈
    修复: interlock.py 重写为三级阈值
          指令 deadband: 0.001 m/s / 0.002 rad/s  (任何"有意运动"立即阻)
          噪声地板: 0.005 m/s / 0.01 rad/s  (以下视为编码器噪声)
          明确运动: 0.02 m/s / 0.05 rad/s  (超过即确定运动)
          介于噪声地板与明确运动之间按可疑→moving 处理
    lift_node.py 参数名更新为 base_linear_noise_m_s / base_linear_cmd_deadband_m_s 等
  R3_位置模式6061核验:
    问题: 键盘模式有 6061 核验, 位置模式没有, 模式被外部改动时不会发现
    修复: controller.py 在 position_halting 和 busy 两分支都加 6061==1 核验
          模式变化 → LiftError → 撤任务并故障锁存

# ---------- 实机运动关键发现 ----------
实机发现:
  1_残留60FF导致溜车:
    现象: lift_node 崩溃时驱动器仍在 mode 3, 60FF 速度指令未清零
    结果: 升降从 150811 漂到 1891943 (上漂 60mm), node-guard 超时后才停
    教训: 节点异常退出必须在 on_shutdown 钩子写 60FF=0 + 6040=0x0006
    待办: 检查 lift_node.py 的 shutdown 路径是否覆盖所有崩溃分支
  2_驱动器故障 SW=0x4218:
    现象: lift_node 重启后驱动器报 fault bit, error=0x0001, error2=0x1000
    处理: /lift/reset_fault 成功清除; 之前暂停可能因死前 CAN 写入中断
    待办: 查 FD125 手册 2601/2602 错误码含义
  3_键盘neutral_required:
    现象: 直接发 +1 被静默忽略, 必须先发 0 清 neutral_required
    文档: 已在交接清单 4.3 节描述, 但首次接入实机时需提醒
  4_master参数缓存:
    现象: 改了 lift.yaml 重启 sim 后 initial_top_height_m 仍是旧值
    原因: rosparam 在 master 上持久化, roslaunch 只 load 不 delete
    处理: rosparam delete /lift/<key> 或重启 master

