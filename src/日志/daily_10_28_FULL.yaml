| devel 陈旧副本 | 不存在: `devel/lib/kinco_lift_control/lift_node.py` 是 catkin relay, exec 源文件; `dist-packages/kinco_lift/__init__.py` 把 `src/kinco_lift_control/src` 插入 sys.path, 均实时指向源 |
