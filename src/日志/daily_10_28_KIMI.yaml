  T3_FD125错误码: 已更正 (REVIEW_20261028_AM_GPT 提供手册定义)
    - FD1X5手册7.12节(印刷页108-109): 2601/2602都是Unsigned16位掩码
      2601 bit0(0x0001)=扩展错误; 2602 bit12(0x1000)=CAN总线中断; 2602 bit1(0x0002)=看门狗
    - 因此10-27实机读数2601=0x0001+2602=0x1000 = "扩展错误伴CAN总线中断",
      不是此前假设的节点保护超时/CiA301通用错误; 复位可清除不代表原因已消除
