# ---------- 发现3 闭环: EMCY 0x8100 全部机制查明 ----------
发现3_闭环:
  手册依据:
    - 表9-25/10-2: EMCY 0x8100=总线通讯错误/CAN总线中断(2602 bit12), 0x81FF=总线通讯超时
    - 9.3.3 节点保护: 驱动器从收到第一条RTR起启动通讯保护; 超时且6007=1 → 报警停机
    - 关键: guard计时器持续累计"距上次RTR"时间, 100C=0只停报警不重置计时
  candump铁证 (candump-2026-10-28_003418.log, 行60013):
    - 100C=200 写入后 1ms 内驱动器即发 EMCY 0x8100 — 重武装时计时器陈旧 → 立即超时
    - 这解释了 10-27 崩溃后重启故障与 10-28 的两次"自发"故障
  修复 (controller.py _enable_drive):
    - 新顺序: 6007=0(超时只记录不报警) → 100C=200/100D=3 → NMT start → guard RTR
      → 等回应确认 → 最后才 6007=1 武装
    - 不依赖"RTR刷新计时器"的未证实假设; 6007=0 窗口内超时也不报警
  实机验证:
    - 重启节点(guard计时器已陈旧数十秒) → enable → 无 EMCY, +1s/+3s 持续干净 ✓
    - enable/disable 循环两次, 全部干净 ✓
  仿真建模更正:
    - 节点保护超时建模从 2602 bit1 改为 bit12(0x1000); bit1 是固件内部软件看门狗(0x6010)
    - simulator 新增"重武装时若计时器已超时且6007=1则立即故障"行为
    - 新单测 test_rearm_guard_with_stale_timer_faults_only_when_6007_armed 锁定该行为
  操作规则(实测确认):
    - 干净停节点(SIGTERM/rosnode kill) → close() 写 0xB + 撤防 → 下次启动无假故障
    - 脏杀(TaskStop/SIGKILL) → 无清理帧 → 驱动器 600ms 监督超时报警(安全兜底, 如设计)
    - 每次脏杀后现场操作: 启动 → reset_fault → 继续

